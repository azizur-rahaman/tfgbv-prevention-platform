<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-display">
    <!-- Top Security Header Decoration -->
    <div class="pt-16 pb-12 flex flex-col items-center px-6">
        <div class="w-16 h-16 bg-primary/10 rounded-xl flex items-center justify-center mb-8 border border-primary/20">
            <span class="material-icons text-primary text-3xl">lock</span>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-100 mb-2">Create App Passcode</h1>
        <p class="text-slate-400 text-sm text-center max-w-xs leading-relaxed">
            This PIN protects your evidence locker. Ensure it is unique and difficult to guess.
        </p>
    </div>
    <!-- Passcode Indicators -->
    <div class="flex-grow flex flex-col items-center justify-start pt-4">
        <div class="flex space-x-5">
            <!-- Filled Dot Example -->
            <div class="w-4 h-4 rounded-full bg-primary shadow-[0_0_10px_rgba(19,127,236,0.5)]"></div>
            <div class="w-4 h-4 rounded-full bg-primary shadow-[0_0_10px_rgba(19,127,236,0.5)]"></div>
            <!-- Empty Dots -->
            <div class="w-4 h-4 rounded-full border-2 border-slate-700 bg-transparent"></div>
            <div class="w-4 h-4 rounded-full border-2 border-slate-700 bg-transparent"></div>
            <div class="w-4 h-4 rounded-full border-2 border-slate-700 bg-transparent"></div>
            <div class="w-4 h-4 rounded-full border-2 border-slate-700 bg-transparent"></div>
        </div>
    </div>
    <!-- Numeric Keypad -->
    <div class="pb-12 px-8 max-w-md mx-auto w-full">
        <div class="grid grid-cols-3 gap-4">
            <!-- Row 1 -->
            <button
                class="aspect-square flex flex-col items-center justify-center bg-slate-800/40 hover:bg-slate-700/50 active:bg-primary/20 border border-slate-700/50 rounded-xl transition-colors duration-150">
                <span class="text-2xl font-semibold">1</span>
            </button>
            <button
                class="aspect-square flex flex-col items-center justify-center bg-slate-800/40 hover:bg-slate-700/50 active:bg-primary/20 border border-slate-700/50 rounded-xl transition-colors duration-150">
                <span class="text-2xl font-semibold">2</span>
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">ABC</span>
            </button>
            <button
                class="aspect-square flex flex-col items-center justify-center bg-slate-800/40 hover:bg-slate-700/50 active:bg-primary/20 border border-slate-700/50 rounded-xl transition-colors duration-150">
                <span class="text-2xl font-semibold">3</span>
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">DEF</span>
            </button>
            <!-- Row 2 -->
            <button
                class="aspect-square flex flex-col items-center justify-center bg-slate-800/40 hover:bg-slate-700/50 active:bg-primary/20 border border-slate-700/50 rounded-xl transition-colors duration-150">
                <span class="text-2xl font-semibold">4</span>
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">GHI</span>
            </button>
            <button
                class="aspect-square flex flex-col items-center justify-center bg-slate-800/40 hover:bg-slate-700/50 active:bg-primary/20 border border-slate-700/50 rounded-xl transition-colors duration-150">
                <span class="text-2xl font-semibold">5</span>
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">JKL</span>
            </button>
            <button
                class="aspect-square flex flex-col items-center justify-center bg-slate-800/40 hover:bg-slate-700/50 active:bg-primary/20 border border-slate-700/50 rounded-xl transition-colors duration-150">
                <span class="text-2xl font-semibold">6</span>
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">MNO</span>
            </button>
            <!-- Row 3 -->
            <button
                class="aspect-square flex flex-col items-center justify-center bg-slate-800/40 hover:bg-slate-700/50 active:bg-primary/20 border border-slate-700/50 rounded-xl transition-colors duration-150">
                <span class="text-2xl font-semibold">7</span>
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">PQRS</span>
            </button>
            <button
                class="aspect-square flex flex-col items-center justify-center bg-slate-800/40 hover:bg-slate-700/50 active:bg-primary/20 border border-slate-700/50 rounded-xl transition-colors duration-150">
                <span class="text-2xl font-semibold">8</span>
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">TUV</span>
            </button>
            <button
                class="aspect-square flex flex-col items-center justify-center bg-slate-800/40 hover:bg-slate-700/50 active:bg-primary/20 border border-slate-700/50 rounded-xl transition-colors duration-150">
                <span class="text-2xl font-semibold">9</span>
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">WXYZ</span>
            </button>
            <!-- Row 4 -->
            <div class="aspect-square"></div> <!-- Spacer -->
            <button
                class="aspect-square flex flex-col items-center justify-center bg-slate-800/40 hover:bg-slate-700/50 active:bg-primary/20 border border-slate-700/50 rounded-xl transition-colors duration-150">
                <span class="text-2xl font-semibold">0</span>
            </button>
            <button
                class="aspect-square flex flex-col items-center justify-center hover:text-primary transition-colors duration-150">
                <span class="material-icons text-3xl">backspace</span>
            </button>
        </div>
    </div>
    <!-- Security Badge Footer -->
    <div class="py-6 flex flex-col items-center justify-center opacity-40">
        <div class="flex items-center space-x-2 text-[10px] uppercase font-bold tracking-[0.2em] text-slate-500">
            <span class="material-icons text-sm">verified_user</span>
            <span>Military Grade Encryption</span>
        </div>
    </div>
</body>

</html>
