<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>High-Security OTP Verification</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display flex items-center justify-center min-h-screen p-4">
    <div
        class="max-w-md w-full space-y-8 bg-slate-900/50 dark:bg-slate-900/40 p-8 rounded-xl border border-slate-800 shadow-2xl">
        <!-- Header Section -->
        <div class="text-center space-y-3">
            <div class="flex justify-center mb-6">
                <div
                    class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center border border-primary/20">
                    <span class="material-icons text-primary text-3xl">shield</span>
                </div>
            </div>
            <h2 class="text-2xl font-semibold text-slate-900 dark:text-slate-100 tracking-tight">
                Enter Verification Code
            </h2>
            <p class="text-slate-600 dark:text-slate-400 text-sm leading-relaxed max-w-xs mx-auto">
                We sent a 6-digit code to your phone. Please enter it below to secure your account.
            </p>
        </div>
        <!-- OTP Input Form -->
        <form class="space-y-8">
            <div class="flex justify-between gap-2 sm:gap-4">
                <input autofocus=""
                    class="w-12 h-14 sm:w-14 sm:h-16 text-center text-xl font-semibold bg-slate-900 dark:bg-slate-950 border border-slate-700 dark:border-slate-800 rounded-lg text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all"
                    maxlength="1" type="text" value="" />
                <input
                    class="w-12 h-14 sm:w-14 sm:h-16 text-center text-xl font-semibold bg-slate-900 dark:bg-slate-950 border border-slate-700 dark:border-slate-800 rounded-lg text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all"
                    maxlength="1" type="text" value="" />
                <input
                    class="w-12 h-14 sm:w-14 sm:h-16 text-center text-xl font-semibold bg-slate-900 dark:bg-slate-950 border border-slate-700 dark:border-slate-800 rounded-lg text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all"
                    maxlength="1" type="text" value="" />
                <input
                    class="w-12 h-14 sm:w-14 sm:h-16 text-center text-xl font-semibold bg-slate-900 dark:bg-slate-950 border border-slate-700 dark:border-slate-800 rounded-lg text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all"
                    maxlength="1" type="text" value="" />
                <input
                    class="w-12 h-14 sm:w-14 sm:h-16 text-center text-xl font-semibold bg-slate-900 dark:bg-slate-950 border border-slate-700 dark:border-slate-800 rounded-lg text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all"
                    maxlength="1" type="text" value="" />
                <input
                    class="w-12 h-14 sm:w-14 sm:h-16 text-center text-xl font-semibold bg-slate-900 dark:bg-slate-950 border border-slate-700 dark:border-slate-800 rounded-lg text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all"
                    maxlength="1" type="text" value="" />
            </div>
            <div class="text-center">
                <button class="text-sm font-medium text-primary hover:text-primary/80 transition-colors" type="button">
                    Resend Code
                </button>
            </div>
            <!-- Action Button -->
            <button
                class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-semibold rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2"
                type="submit">
                <span>Verify</span>
                <span class="material-icons text-lg">arrow_forward</span>
            </button>
        </form>
        <!-- Footer Note -->
        <div class="pt-6 border-t border-slate-800/50 flex flex-col items-center gap-4">
            <div class="flex items-center gap-2 text-[10px] uppercase tracking-widest text-slate-500 font-semibold">
                <span class="material-icons text-xs">lock</span>
                End-to-end encrypted session
            </div>
            <div class="w-full flex justify-center opacity-40">
                <img alt="Security Badge" class="h-8 grayscale object-contain"
                    data-alt="Abstract minimalist security icon emblem"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuDg94UaDyW76u5E1cR8gqBBcfwHs0aE0UDs_m1SyX0JBT6-Hi-616uNRP5MvviUShMCFrSSkmnG9zGRVoRhuavyAnTzWLvVXnc6t2pxOl2lQCzH9yFsXdaPWubE-pMQLhi900GJV2YxeW86jlhbYa9Vc6hGLpRydnQcpHVMNU8cfJVhDaPW7YYMZq2XIcrsbNvYvbp7qhmDeQgXGEsMWpKZCEjK_9pLOSMKciy2vCSoCcj3V_Tp1EIXD6yVp8q8Zi6ZeB_rzf911_L2" />
            </div>
        </div>
    </div>
</body>

</html>
