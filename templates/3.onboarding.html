<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Secure Reporting App Onboarding</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#0B1220",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
        <header class="flex items-center p-4 justify-between">
            <button aria-label="Go back"
                class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start focus:outline-none">
                <span class="material-symbols-outlined text-3xl">arrow_back</span>
            </button>
            <h2
                class="text-slate-900 dark:text-slate-100 text-lg font-semibold leading-tight tracking-tight flex-1 text-center pr-12">
                Onboarding</h2>
        </header>
        <main class="flex-1 flex flex-col items-center justify-center px-6 max-w-md mx-auto w-full">
            <div class="relative w-full aspect-square flex items-center justify-center mb-12">
                <div class="absolute inset-0 bg-primary/5 rounded-full blur-3xl"></div>
                <div class="relative flex items-center justify-center">
                    <div
                        class="bg-slate-800/50 dark:bg-slate-800/40 p-12 rounded-3xl border border-slate-700/30 shadow-2xl backdrop-blur-sm relative overflow-hidden">
                        <div class="absolute top-4 left-4 opacity-20">
                            <span class="material-symbols-outlined text-4xl">calculate</span>
                        </div>
                        <div class="flex flex-col items-center gap-6">
                            <span class="material-symbols-outlined text-8xl text-primary icon-fill">encrypted</span>
                            <div class="flex gap-2 items-center text-primary/40">
                                <div class="h-1 w-8 bg-current rounded-full"></div>
                                <span class="material-symbols-outlined text-sm">sync</span>
                                <div class="h-1 w-8 bg-current rounded-full"></div>
                            </div>
                        </div>
                        <div class="absolute bottom-4 right-4 opacity-20">
                            <span class="material-symbols-outlined text-4xl">pin</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-center space-y-4">
                <h1 class="text-slate-900 dark:text-slate-100 text-4xl font-bold tracking-tight">
                    Safe &amp; Discreet
                </h1>
                <p class="text-slate-600 dark:text-slate-400 text-lg leading-relaxed px-2">
                    The app stays hidden and protects you in high-risk situations.
                </p>
            </div>
        </main>
        <footer class="p-6 space-y-8 max-w-md mx-auto w-full">
            <div class="flex w-full flex-row items-center justify-center gap-3">
                <div class="h-2 w-2 rounded-full bg-slate-300 dark:bg-slate-700"></div>
                <div class="h-2 w-2 rounded-full bg-slate-300 dark:bg-slate-700"></div>
                <div class="h-2 w-8 rounded-full bg-primary transition-all duration-300"></div>
            </div>
            <div class="flex flex-col gap-3">
                <button
                    class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
                    <span>Verify Identity</span>
                    <span class="material-symbols-outlined text-xl">shield_person</span>
                </button>
                <button
                    class="w-full bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 font-medium py-3 rounded-xl transition-colors">
                    Skip for now
                </button>
            </div>
        </footer>
        <div class="h-4"></div>
    </div>
</body>

</html>
